version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: sense_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sense_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sense_password}
      POSTGRES_DB: ${POSTGRES_DB:-sense_db}
    # Porta removida para segurança: o banco só será acessível internamente pelo backend
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    container_name: sense_backend
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-sense_user}:${POSTGRES_PASSWORD:-sense_password}@db:5432/${POSTGRES_DB:-sense_db}
      - SECRET_KEY=${SECRET_KEY:-minha_chave_secreta_super_segura}
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=30
    ports:
      - "8000:8000"
    depends_on:
      - db
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        # Se você futuramente usar um IP/Domínio fixo, substitua localhost pelo IP/Domínio.
        # Por padrão, vamos assumir que o frontend fará chamadas na porta 8000 do próprio domínio.
        VITE_API_URL: http://localhost:8000
    container_name: sense_frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
