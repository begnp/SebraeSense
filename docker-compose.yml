version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: sense_postgres
    environment:
      POSTGRES_USER: sense_user
      POSTGRES_PASSWORD: sense_password
      POSTGRES_DB: sense_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
