version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: sense_postgres
    environment:
      POSTGRES_USER: sense_user
      POSTGRES_PASSWORD: sense_password
      POSTGRES_DB: sense_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    container_name: sense_backend
    environment:
      - DATABASE_URL=postgresql://sense_user:sense_password@db:5432/sense_db
      - SECRET_KEY=minha_chave_secreta_super_segura
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=30
    ports:
      - "8000:8000"
    depends_on:
      - db
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        # Se você futuramente usar um IP/Domínio fixo, substitua localhost pelo IP/Domínio.
        # Por padrão, vamos assumir que o frontend fará chamadas na porta 8000 do próprio domínio.
        VITE_API_URL: http://localhost:8000
    container_name: sense_frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
